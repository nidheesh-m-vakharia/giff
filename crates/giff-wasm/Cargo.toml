[package]
name = "giff-wasm"
version = "0.2.0"
edition = "2021"
description = "WebAssembly bindings for giff-core — for browser-side use of stack types and algorithms."
license = "MIT"
repository = "https://github.com/nidheesh-m-vakharia/giff"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
giff-core = { path = "../giff-core", version = "0.2" }
serde_json = "1"
wasm-bindgen = "0.2"
