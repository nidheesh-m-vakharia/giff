[package]
name = "giff-github"
version = "0.2.0"
edition = "2021"
description = "GitHub forge backend for giffstack — ForgeBackend trait + GitHubForge (sync, ureq)."
license = "MIT"
repository = "https://github.com/nidheesh-m-vakharia/giff"

[dependencies]
giff-core = { path = "../giff-core", version = "0.2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6"
