[package]
name = "giff-github"
version = "0.1.0"
edition = "2021"

[dependencies]
giff-core = { path = "../giff-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6"
