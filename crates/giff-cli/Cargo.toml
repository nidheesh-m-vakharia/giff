[package]
name = "giffstack"
version = "0.2.0"
edition = "2021"
description = "Stacked diffs for GitHub. CLI for managing chains/trees of dependent PRs."
license = "MIT"
repository = "https://github.com/nidheesh-m-vakharia/giff"
homepage = "https://github.com/nidheesh-m-vakharia/giff"
documentation = "https://docs.rs/giffstack"
readme = "../../README.md"
keywords = ["git", "github", "stacked-diffs", "cli", "pr"]
categories = ["command-line-utilities", "development-tools"]

# Binary name kept as `giff` so the install command (`cargo install giffstack`)
# differs from the runtime command (`giff`) — matching how `ripgrep` ships `rg`.
# The published .crate must contain dashboard-dist/ (which is gitignored). Cargo's
# default rules already include all paths under the crate root unless excluded, so
# we list explicitly to nail down what does and doesn't land in the published crate.
include = [
    "src/**/*",
    "tests/**/*",
    "build.rs",
    "Cargo.toml",
    "dashboard-dist/**/*",
]

[[bin]]
name = "giff"
path = "src/main.rs"

[dependencies]
# When publishing to crates.io, cargo uses the version field; when building locally,
# the path field wins. Both keep dev and release flows working.
giff-core   = { path = "../giff-core",   version = "0.2" }
giff-git    = { path = "../giff-git",    version = "0.2" }
giff-github = { path = "../giff-github", version = "0.2" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.27"
dirs = "5"
ratatui = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }

# Dashboard server (`giff dashboard`):
# - tiny_http: sync HTTP server, ~3 deps, no async runtime
# - include_dir: compile-time directory embedding for the SvelteKit build
# - mime_guess: file extension → Content-Type
# - open: launch the user's default browser cross-platform
tiny_http = "0.12"
include_dir = "0.7"
mime_guess = "2"
open = "5"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
