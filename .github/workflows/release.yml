# Auto-publishes the four library/CLI crates to crates.io when commits land on main.
# Each step compares the version in Cargo.toml against the latest published version on
# crates.io; if they match, that crate is skipped (so pushing to main without a version
# bump is a no-op rather than a failure).
#
# Crates are published in dependency order with brief sleeps between them so the index
# has time to propagate before the next crate's `cargo publish` looks up its deps.
#
# Requires a CARGO_REGISTRY_TOKEN repository secret (Settings → Secrets and variables →
# Actions → New repository secret). Generate the token at https://crates.io/me.

name: Release

on:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# Don't run two release jobs concurrently — they'd race on the index propagation sleeps.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    # Scoped to the `crates-io` GitHub environment. The CARGO_REGISTRY_TOKEN secret lives
    # there (not as a repo secret), and the environment can be configured with required
    # reviewers + branch protection in Settings → Environments. With reviewers configured,
    # this job pauses on every run waiting for an approval click before the secret is
    # injected — a manual gate against accidental publishes.
    environment: crates-io
    permissions:
      contents: write # for tagging the release commit
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      # The `giff dashboard` command embeds the SvelteKit static export at compile
      # time via include_dir!. Build the SvelteKit app and stage it into the CLI
      # crate's `dashboard-dist/` so the published .crate carries real assets, not
      # the build.rs stub. (Cargo's `package.include` in giff-cli/Cargo.toml ships
      # this directory in the published tarball.)
      - name: Build SvelteKit dashboard
        working-directory: apps/web
        run: |
          npm ci
          npm run build

      - name: Stage frontend assets into CLI crate
        run: |
          rm -rf crates/giff-cli/dashboard-dist
          cp -r apps/web/build crates/giff-cli/dashboard-dist

      # Verify the workspace at least compiles before we touch crates.io.
      - name: Sanity build
        run: cargo build --workspace

      - name: Sanity test
        run: cargo test --workspace

      # Helper used below: returns 0 if the local Cargo.toml version differs from the
      # latest version on crates.io (i.e. there's something to publish), 1 otherwise.
      # `published` returns empty when the crate has never been published, in which case
      # we always need to publish.
      - name: Publish giff-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: ./.github/scripts/publish-if-new.sh giff-core

      - name: Wait for index propagation
        run: sleep 30

      - name: Publish giff-git
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: ./.github/scripts/publish-if-new.sh giff-git

      - name: Wait for index propagation
        run: sleep 30

      - name: Publish giff-github
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: ./.github/scripts/publish-if-new.sh giff-github

      - name: Wait for index propagation
        run: sleep 30

      # `--allow-dirty` because dashboard-dist/ is gitignored but populated at build
      # time above; cargo would otherwise refuse to publish from a "dirty" tree.
      - name: Publish giffstack
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: ./.github/scripts/publish-if-new.sh giffstack --allow-dirty

      # Tag the giffstack version when it published this run, so the repo's tag history
      # tracks releases. Skipped if giffstack didn't actually publish (idempotent push).
      - name: Tag release
        if: env.GIFFSTACK_PUBLISHED == 'true'
        env:
          GIFFSTACK_VERSION: ${{ env.GIFFSTACK_VERSION }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$GIFFSTACK_VERSION" -m "giffstack v$GIFFSTACK_VERSION"
          git push origin "v$GIFFSTACK_VERSION"

      - name: Create GitHub release
        if: env.GIFFSTACK_PUBLISHED == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.GIFFSTACK_VERSION }}"
          generate_release_notes: true
